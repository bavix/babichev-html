<button 
  id="theme-toggle" 
  class="pixel-button text-xs"
  aria-label="Toggle theme"
  title="Toggle theme"
>
  <span class="theme-icon theme-icon-dark" aria-hidden="true">DARK</span>
  <span class="theme-icon theme-icon-light" aria-hidden="true">LIGHT</span>
</button>

<style>
  .theme-icon-light {
    display: none;
  }
  
  html.light .theme-icon-dark {
    display: none;
  }
  
  html.light .theme-icon-light {
    display: inline;
  }
</style>

<script>
  (function() {
    'use strict';
    
    const STORAGE_KEY = 'babichev-theme';
    const THEME_DARK = 'dark';
    const THEME_LIGHT = 'light';
    
    function toggleTheme() {
      const root = document.documentElement;
      const currentTheme = root.classList.contains(THEME_LIGHT) ? THEME_LIGHT : THEME_DARK;
      const newTheme = currentTheme === THEME_LIGHT ? THEME_DARK : THEME_LIGHT;
      
      console.log('[Theme] Toggling from', currentTheme, 'to', newTheme);
      
      root.classList.remove(THEME_DARK, THEME_LIGHT);
      root.classList.add(newTheme);
      
      try {
        localStorage.setItem(STORAGE_KEY, newTheme);
      } catch (e) {
        console.warn('Failed to save theme:', e);
      }
      
      window.__theme = newTheme;
    }
    
    document.addEventListener('DOMContentLoaded', function() {
      const toggleButton = document.getElementById('theme-toggle');
      if (toggleButton) {
        console.log('[Theme] Toggle button found, attaching click listener');
        toggleButton.addEventListener('click', function(e) {
          e.preventDefault();
          console.log('[Theme] Toggle button clicked');
          toggleTheme();
        });
      } else {
        console.warn('[Theme] Toggle button not found');
      }
    });
  })();
</script>
