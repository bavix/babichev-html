<button 
  id="theme-toggle" 
  class="pixel-button text-xs"
  aria-label="Toggle theme"
  title="Toggle theme"
>
  <span class="theme-icon theme-icon-dark" aria-hidden="true">DARK</span>
  <span class="theme-icon theme-icon-light" aria-hidden="true">LIGHT</span>
</button>

<style>
  .theme-icon-light {
    display: none;
  }
  
  .light .theme-icon-dark {
    display: none;
  }
  
  .light .theme-icon-light {
    display: inline;
  }
</style>

<script>
  (function() {
    'use strict';
    
    const STORAGE_KEY = 'babichev-theme';
    const THEME_DARK = 'dark';
    const THEME_LIGHT = 'light';
    
    function getSavedTheme() {
      try {
        return localStorage.getItem(STORAGE_KEY) || THEME_DARK;
      } catch (e) {
        return THEME_DARK;
      }
    }
    
    function saveTheme(theme) {
      try {
        localStorage.setItem(STORAGE_KEY, theme);
      } catch (e) {
        console.warn('Failed to save theme to localStorage:', e);
      }
    }
    
    function getCurrentTheme() {
      let theme = getSavedTheme();
      
      if (!theme || !localStorage.getItem(STORAGE_KEY)) {
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        theme = prefersDark ? THEME_DARK : THEME_LIGHT;
      }
      
      return theme;
    }
    
    function applyTheme(theme) {
      const root = document.documentElement;
      
      root.classList.remove(THEME_DARK, THEME_LIGHT);
      root.classList.add(theme);
      
      saveTheme(theme);
    }
    
    function toggleTheme() {
      const currentTheme = document.documentElement.classList.contains(THEME_LIGHT) 
        ? THEME_LIGHT 
        : THEME_DARK;
      
      const newTheme = currentTheme === THEME_LIGHT ? THEME_DARK : THEME_LIGHT;
      applyTheme(newTheme);
    }
    
    document.addEventListener('DOMContentLoaded', function() {
      const toggleButton = document.getElementById('theme-toggle');
      if (toggleButton) {
        toggleButton.addEventListener('click', toggleTheme);
      }
      
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
        if (!localStorage.getItem(STORAGE_KEY)) {
          const newTheme = e.matches ? THEME_DARK : THEME_LIGHT;
          applyTheme(newTheme);
        }
      });
    });
  })();
</script>
