<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} - {{ .Site.Title }}{{ end }}</title>
  {{ partial "seo.html" . }}
  <link rel="icon" type="image/svg+xml" href="{{ "/assets/svg/mascot.svg" | absURL }}">
  <link rel="apple-touch-icon" href="{{ "/assets/svg/mascot.svg" | absURL }}">
  <link rel="manifest" href="{{ "/assets/mobile-icons/manifest.json" | absURL }}">
  <link rel="stylesheet" href="{{ "/css/main.min.css" | absURL }}">
  {{ partial "structured-data.html" . }}
  
  <script>
    (function() {
      try {
        let theme = localStorage.getItem('babichev-theme');
        
        if (!theme) {
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          theme = prefersDark ? 'dark' : 'light';
          localStorage.setItem('babichev-theme', theme);
        }
        
        // Remove any existing theme classes
        document.documentElement.classList.remove('dark', 'light');
        // Add the current theme class immediately
        document.documentElement.classList.add(theme);
        
        // Store in window for debugging
        window.__theme = theme;
      } catch (e) {
        console.error('Theme initialization error:', e);
        // Fallback to dark theme if localStorage fails
        document.documentElement.classList.remove('dark', 'light');
        document.documentElement.classList.add('dark');
        window.__theme = 'dark';
      }
    })();
  </script>
</head>
<body class="font-pixel">
  <div class="container mx-auto px-4 py-4 max-w-5xl">
    {{ partial "header.html" . }}
    
    <main class="mt-6">
      {{ block "main" . }}{{ end }}
    </main>
    
    {{ partial "footer.html" . }}
  </div>
</body>
</html>
